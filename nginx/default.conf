server {
    listen 80;
    server_name localhost;

    location / {
        # IMPORTANTE: Este proxy_pass assume que você corrigirá o service
        # da sua aplicação para rodar na porta 3123, como está nos seus arquivos originais.
        # Se você corrigir a porta da aplicação para 3123, este valor também deve ser 3123.
        proxy_pass http://trabalho-adrian-service:3123;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}