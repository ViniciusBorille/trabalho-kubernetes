name: CD - Deploy to Kubernetes

on:
  workflow_run:
    workflows: ["CI - Build & Push Docker"]
    types: [ "completed" ]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    runs-on: self-hosted
    environment: production # opcional: exige aprovação
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set vars
        id: vars
        shell: pwsh
        run: |
          "IMAGE=vborille/trabalho-adrian" | Add-Content -Path $env:GITHUB_OUTPUT
          "TAG_SHA=${{ github.sha.Substring(0, 7) }}" | Add-Content -Path $env:GITHUB_OUTPUT
          "NAMESPACE=${{ secrets.K8S_NAMESPACE || 'default' }}" | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure kubeconfig
        shell: pwsh 
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.kube"
          [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String("${{ secrets.KUBE_CONFIG_DATA }}")) | Set-Content -Path "$env:USERPROFILE\.kube\config"

      - name: Create namespace if not exists
        shell: pwsh
        run: |
          try {
            kubectl get ns ${{ steps.vars.outputs.NAMESPACE }} -ErrorAction Stop
          } catch {
            Write-Host "Namespace nao encontrado, a criar..."
            kubectl create ns ${{ steps.vars.outputs.NAMESPACE }}
          }

      # Aplica/garante os serviços/ingress/etc. estáticos (opcional na primeira vez)
      - name: Apply base manifests (Service, Prometheus, Grafana, Nginx)
        shell: pwsh
        run: |
          kubectl apply -n ${{ steps.vars.outputs.NAMESPACE }} -f k8s/service.yaml -ErrorAction SilentlyContinue
          kubectl apply -n ${{ steps.vars.outputs.NAMESPACE }} -f k8s/prometheus-deployment.yaml -ErrorAction SilentlyContinue
          kubectl apply -n ${{ steps.vars.outputs.NAMESPACE }} -f k8s/grafana-deployment.yaml -ErrorAction SilentlyContinue
          kubectl apply -n ${{ steps.vars.outputs.NAMESPACE }} -f k8s/nginx-deployment.yaml -ErrorAction SilentlyContinue
          kubectl apply -n ${{ steps.vars.outputs.NAMESPACE }} -f k8s/nginx-service.yaml -ErrorAction SilentlyContinue
          kubectl apply -n ${{ steps.vars.outputs.NAMESPACE }} -f k8s/prometheus-config.yaml -ErrorAction SilentlyContinue

      # Aplica/garante o Deployment (se ainda não existir)
      - name: Apply app deployment (first time)
        run: |
          kubectl apply -n ${{ steps.vars.outputs.NAMESPACE }} -f k8s/deployment.yaml

      # Atualiza a imagem para a tag nova (idempotente)
      - name: Set image to new tag
        run: |
          kubectl set image deployment/trabalho-adrian trabalho-adrian=${{ steps.vars.outputs.IMAGE }}:${{ steps.vars.outputs.TAG_SHA }} -n ${{ steps.vars.outputs.NAMESPACE }}

      - name: Wait rollout
        run: |
          kubectl rollout status deployment/trabalho-adrian -n ${{ steps.vars.outputs.NAMESPACE }} --timeout=120s

      - name: Show services (debug)
        run: |
          kubectl get svc -n ${{ steps.vars.outputs.NAMESPACE }}
          kubectl get pods -o wide -n ${{ steps.vars.outputs.NAMESPACE }}